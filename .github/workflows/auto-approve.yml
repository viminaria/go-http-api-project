name: Auto-Approve Dependabot
on: pull_request_target

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  auto-approve-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE'
            });

      - uses: actions/checkout@v5

      - name: Merge minor/patch updates
        if: |
          github.event.pull_request.title != null && 
          (contains(github.event.pull_request.title, 'bump') || contains(github.event.pull_request.title, 'update') || contains(github.event.pull_request.title, 'version'))
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
